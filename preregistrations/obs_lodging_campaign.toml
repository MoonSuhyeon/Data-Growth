# 사전등록 — 숙박 플랫폼 캠페인의 외부 관측 분석
#
# `docs/external-market-report.md` 의 D2.
#
# **실험의 사전등록과 목적이 다르다.** 실험에서 못 박는 것은 표본 수와 α 였다.
# 여기서 못 박아야 하는 것은 **비교 대상**이다.
#
# 무작위 배정이 없으면 인과 주장은 누군가 고른 대조군 위에 선다. 결과를 본 뒤에
# "이 경쟁사와 비교하니 잘 나오네" 하고 고르면, 그건 관측 자료판 p-해킹이다.
# 대조군 후보를 미리 적고 **왜 그것인지**까지 적어 두면 그 여지가 사라진다.
#
# 형식이 TOML 인 이유는 exp_sticky_cta 와 같다: `tomllib` 는 표준 라이브러리이고
# 읽기 전용이라 파이프라인이 실수로도 이 파일을 고쳐 쓸 수 없다.

id = "obs_lodging_campaign"

# **소급이다.** 캠페인은 이미 돌았고 공시도 이미 나와 있다.
#
# 관측 연구에서 "prospective" 라고 적으려면 결과 데이터를 **가져오기 전에** 이
# 파일이 커밋돼 있어야 한다. 그게 이 설계에서 사전등록이 할 수 있는 거의 전부다 —
# 배정을 통제할 수 없으니 통제할 수 있는 건 순서뿐이다.
kind = "retrospective"
registered_at = "2026-08-21"

hypothesis = """
2024년 하반기 숙박 플랫폼 A 의 마케팅 캠페인이 브랜드 검색량을 끌어올렸다.

이 가설은 두 개의 다른 질문을 담고 있고, 답할 수 있는 강도가 다르다.
  (a) 캠페인이 실제로 집행되었는가 — 관측으로 답한다. 답할 수 있다.
  (b) 그것이 효과를 냈는가 — 무작위 배정이 없다. 약하게만 답한다.
분석은 (a) 와 (b) 를 섞어 쓰지 않는다.
"""

[primary]
# 주 지표 하나. 여럿 두면 그중 하나가 움직인 것을 사후에 고를 수 있다.
metric = "brand_search_index"
direction = "up"
alpha = 0.05
# **MDE 를 적지 않는다.** 표본을 늘릴 수 없으므로 "이만큼은 잡겠다" 는 약속을
# 할 수 없다. 못 하는 약속을 적어 두면 그 자체가 거짓말이다.

[design]
method = "difference_in_differences"
unit = "brand"
# 개입일. **결과를 보고 옮기지 않는다.** 캠페인 시작일을 며칠씩 밀어 보며 가장
# 좋은 값을 찾는 것이 이 설계에서 가장 흔한 부정행위다.
intervention_date = "2024-07-01"
pre_periods = 8      # 월 단위
post_periods = 6

# 조회 창을 미리 못 박는다. 상대 지수는 요청 창마다 자가 달라서, 창을 나중에
# 정하면 "좋아 보이는 창" 을 고를 수 있다.
fetch_window_start = "2023-11-01"
fetch_window_end = "2024-12-31"
scale = "relative_index"

# ── 대조군. **이 절이 이 파일의 핵심이다.**
[control]
name = "숙박 플랫폼 B"
reason = """
같은 국내 숙박 예약 시장에서 겨루고, 이용자층과 계절성이 겹친다. 그리고
관측 창 안에 자체 대형 캠페인 공시가 없다.
"""
# 미리 적어 둔 탈락 후보. **왜 안 골랐는지가 남아야** 나중에 "그때 그걸 골랐으면
# 결과가 달랐을 텐데" 라는 의심에 답할 수 있다.
rejected = [
    "여행 메타서치 C — 예약이 아니라 검색 중개라 수요 구조가 다르다",
    "호텔 체인 D — 자체 브랜드 검색이 오프라인 인지도에 크게 묶여 있다",
]

# ── 문턱. 실험의 SRM 자리에 평행추세가 온다.
[gates]
pretrend_alpha = 0.05
pretrend_tolerance = 0.15        # 처치군 기울기 대비 허용 차이
min_pre_periods = 4
# 평행추세를 통과하지 못하면 **효과를 추정하지 않는다.** 주석을 달고 계수를
# 내놓는 방식은 금지한다 — 읽는 사람은 계수를 읽고 단서는 안 읽는다.
estimate_only_if_parallel = true

# ── 미리 이름 붙인 위협. 분석이 끝난 뒤 유리한 것만 남기지 못하게 한다.
[[threats]]
name = "대조군 자체 캠페인"
note = "B 가 같은 시기에 자기 캠페인을 돌렸다면 효과가 아래로 눌린다"

[[threats]]
name = "성수기"
note = "관측 창에 여름 성수기가 들어 있다. 두 브랜드에 같은 크기로 걸리는지 알 수 없다"

[[threats]]
name = "플랫폼 알고리즘 변경"
note = "검색 포털의 노출 규칙이 바뀌면 두 계열이 같이 움직이지 않는다"

[[threats]]
name = "선택 편향"
note = "A 를 처치군으로 고른 기준이 결과와 상관있을 수 있다"

# 부분군은 보지 않는다. 관측이 14개뿐이라 쪼개면 아무것도 안 남는다.
# **적어 두는 것 자체가 약속이다** — 나중에 쪼개 본 결과를 보고하면 이 줄이 위반된다.
[multiplicity]
correction = "none"
family_size = 1
