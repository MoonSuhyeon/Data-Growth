# 사전등록 — 모바일 상세 페이지의 sticky CTA
#
# **이 파일은 숫자를 보기 전에 못 박는 주장이다.** 형식이 TOML 인 것도 결정이다:
# `tomllib` 는 파이썬 표준 라이브러리이고 **읽기 전용**이라, 파이프라인이 실수로도
# 이 파일을 고쳐 쓸 수 없다. 사전등록을 코드로 두면 결과를 보고 조건을 손대는 일이
# 너무 쉬워진다.
#
# 바꾸려면 커밋이 남는다. 언제 왜 바꿨는지가 이력에 남는 것이 이 파일의 전부다.

id = "exp_sticky_cta"

# **이 분석은 소급이다.** 실험은 이미 돌았고, 등록은 그 뒤에 쓰였다.
#
# 정직하게 그렇게 적는다. "prospective" 로 적어 두면 이 저장소가 스스로에게
# 거짓말하는 셈이고, 검사기도 그 거짓말을 통과시킨다. 소급 분석이 쓸모없다는
# 뜻이 아니라 — 결론의 강도가 다르다는 뜻이고, 판독문이 그 사실을 달고 다녀야 한다.
kind = "retrospective"
registered_at = "2026-08-21"

hypothesis = """
모바일 숙소 상세 페이지에 하단 고정 CTA 를 노출하면 예약 시작률이 오른다.
모바일은 트래픽의 다수인데 예약 시작 단계에서 데스크톱보다 크게 떨어지고,
그 단계가 퍼널에서 사람이 가장 많이 빠지는 곳이다.
"""

[primary]
# **주 지표는 하나다.** 여럿을 두면 그중 하나가 유의할 확률이 올라가고,
# 사후에 "이게 주 지표였다" 고 고를 수 있게 된다.
metric = "funnel.booking_started_rate"
direction = "up"
mde = 0.10          # 상대. 이보다 작은 효과는 잡을 생각이 없다고 미리 밝힌다
alpha = 0.05
power = 0.80
baseline = 0.2701   # 등록 시점의 모바일 예약 시작률

[design]
unit = "anonymous_id"            # 배정 단위. 사람 단위지 세션 단위가 아니다
population = "device_type == MOBILE"
assignment = "server"            # 원격 배정 — 릴리스에 묶이지 않는다
required_per_group = 4371        # required_sample_size(baseline, mde, alpha, power)

# **멈추는 규칙을 미리 정한다.** 없으면 "유의해질 때까지 본다" 가 되고,
# 그건 α 를 0.05 로 정한 것을 무의미하게 만든다.
stopping = """
그룹당 4,371명에 도달하기 전에는 전환율을 결론으로 읽지 않는다.
도달 전 중간 확인은 SRM 과 수집 품질만 본다.
"""

# 배정이 틀어졌으면 전환율을 읽지 않는다. 순서가 곧 주장이다.
[gates]
srm_alpha = 0.001
read_conversion_only_if_srm_healthy = true

# **볼 부분군을 미리 적는다.** 여기 없는 축으로 쪼갠 결과를 보고하면 사후 해석이다.
# 적어 두면 "모바일에서 특히 효과가 컸다" 같은 문장이 계획된 것인지 주워온 것인지
# 구분된다.
[[segments]]
name = "visit_type"
reason = "재방문자는 이미 상품을 아는 상태라 CTA 의 효과가 다를 수 있다"

[[segments]]
name = "region"
reason = "지역별 수요 편차가 커서(WAPE 0.275~0.516) 효과가 균일하지 않을 수 있다"

# 부분군을 여럿 보면 그중 하나가 유의할 확률이 올라간다. 보정을 미리 정한다.
[multiplicity]
correction = "bonferroni"
family_size = 2                  # 위 segments 개수
